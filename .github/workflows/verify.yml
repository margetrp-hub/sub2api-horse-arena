name: Verify game

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: game-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify gameplay, API failures and authentication recovery
        run: |
          npm run test:practice
          npm run test:api
          npm run test:auth
      - name: Typecheck and build frontend
        run: npm run build
      - name: Build frontend and API deployment images
        run: |
          docker build --file deploy/game-frontend.Dockerfile --tag oh-haolema-web:verify .
          docker build --file server/Dockerfile --tag oh-haolema-api:verify .
