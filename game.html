<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OH!薅乐马 · Token 消耗榜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ui-font: "Cascadia Mono", "Cascadia Code", "Microsoft YaHei UI", "Microsoft YaHei", monospace;
    --gold: #ffd166;
    --green: #55dec0;
    --cyan: #72d7e1;
    --panel: #0b1c20;
    --panel-raised: #14383b;
    --line: #2a8f85;
    --ink: #f5f1dc;
    --pink: #ff6b5b;
  }
  html, body {
    height: 100%;
    background: #071416;
    color: var(--ink);
    font-family: var(--ui-font);
    overflow: hidden;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center; padding: 10px;
    background-color: #071416;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  #shell {
    position: relative; width: min(calc(100% - 16px), 1480px); height: min(calc(100vh - 16px), 960px); max-height: 100%; display: grid;
    grid-template-columns: clamp(300px, 22vw, 360px) minmax(0, 1fr);
    gap: 10px; align-items: center; padding: 8px;
    overflow: visible;
  }
  @keyframes panelSweep {
    0%, 12% { transform: translateX(0); opacity: .35; }
    48% { transform: translateX(250%); opacity: 1; }
    70%, 100% { transform: translateX(250%); opacity: .2; }
  }
  #frame {
    position: relative;
    width: 100%; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3;
    grid-column: 2; grid-row: 1; justify-self: start;
    border: 4px solid #2a8f85; background: #0e2528;
    box-shadow: inset 0 0 0 2px var(--gold), 8px 8px 0 #080617;
    overflow: hidden;
  }
  #frame::before,
  #sidePanel::before {
    content: ""; position: absolute; z-index: 5; top: 5px; left: 12px;
    width: 27%; height: 3px; background: var(--pink); box-shadow: 0 0 0 1px #080617;
    pointer-events: none; animation: panelSweep 4.2s steps(18, end) infinite;
  }
  #sidePanel {
    width: 100%; height: calc(100% - 28px);
    grid-column: 1; grid-row: 1;
    position: relative; min-width: 0; display: flex; flex-direction: column; gap: 8px;
    padding: 10px; background: var(--panel); border: 4px solid #2a8f85;
    box-shadow: inset 0 0 0 2px var(--gold), 8px 8px 0 #080617;
    background-image: linear-gradient(rgba(85,222,192,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(85,222,192,0.05) 1px, transparent 1px);
    background-size: 12px 12px;
  }
  canvas#scene {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; display: block; cursor: pointer;
  }
  .hud { position: absolute; pointer-events: none; }
  .hud * { pointer-events: auto; }

  /* 顶部状态条 */
  #topbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .stat {
    background: var(--panel-raised); border: 2px solid var(--line);
    border-radius: 0; padding: 7px 5px; text-align: center; min-width: 0;
    box-shadow: 3px 3px 0 #080617;
  }
  .stat .k { font-size: 11px; color: #b5d2cf; letter-spacing: 1px; }
  .stat .v { font-size: 20px; font-weight: 700; color: var(--gold); margin-top: 2px;
             font-variant-numeric: tabular-nums; }
  .stat .v.small { font-size: 15px; color: var(--cyan); }

  /* 实时榜单 */
  #rankPanel {
    width: 100%; min-height: 0; flex: 1; overflow: hidden;
    background: var(--panel-raised); border: 3px solid var(--line);
    border-radius: 0; padding: 10px 10px 12px; box-shadow: 4px 4px 0 #080617;
    display: flex; flex-direction: column;
  }
  #rankPanel h3 {
    font-size: 14px; color: var(--gold); letter-spacing: 2px;
    margin-bottom: 8px; border-bottom: 2px dashed var(--line); padding-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #rankPanel h3 .live { font-size: 10px; color: var(--green); display: flex; align-items: center; gap: 5px; letter-spacing: 1px; }
  #rankPanel h3 .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1.2s infinite; }
  #rankPanel h3 .live.demo { color: var(--gold); }
  #rankPanel h3 .live.demo .dot { background: var(--gold); animation: none; }
  #rankPanel h3 .live.stale { color: #ff9e6d; }
  #rankPanel h3 .live.stale .dot { background: #ff9e6d; animation-duration: 2.4s; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #rankList { position: relative; min-height: 0; flex: 1; display: grid; grid-template-rows: repeat(10, minmax(0, 1fr)); gap: 3px; overflow: visible; }
  .rrow {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    padding: 4px 6px; border-radius: 0; cursor: pointer;
    background: #19464a; border: 1px solid var(--line); margin-bottom: 0;
    box-shadow: 2px 2px 0 #080617;
    transition: background 0.12s, box-shadow 0.12s, transform 0.12s; will-change: transform;
  }
  .rrow:hover { transform: translate(-2px, -2px); background: #235a5a; border-color: var(--green); box-shadow: 4px 4px 0 #080617; }
  .rrow.hot { background: #205356; border-color: var(--cyan); box-shadow: 3px 3px 0 #080617; }
  .rrow .rk { width: 24px; text-align: center; font-weight: 800; color: #b5d2cf; }
  .rrow.top .rk { color: var(--gold); }
  .rrow:nth-child(2) .rk { color: #d7e8df; }
  .rrow:nth-child(3) .rk { color: var(--pink); }
  .rrow .av { width: 20px; height: 20px; border-radius: 0; flex: none; border: 2px solid var(--ink); box-shadow: 2px 2px 0 #080617; }
  .rrow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .tk { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 700; }
  .rrow .fire { font-size: 11px; opacity: 0; transition: opacity 0.2s; }
  .rrow.burst .fire { opacity: 1; }

  .personal-card {
    flex: none; margin-top: 9px; padding: 8px; background: #0e2528;
    border: 2px solid var(--line); box-shadow: 3px 3px 0 #080617;
  }
  .personal-rank-line { display: flex; align-items: end; justify-content: space-between; gap: 8px; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px dashed var(--line); }
  .personal-rank-line small { display: block; color: #b5d2cf; font-size: 9px; }
  .personal-rank-line strong { display: block; margin-top: 2px; color: var(--gold); font-size: 17px; line-height: 1; }
  .personal-rank-line em { max-width: 52%; color: var(--green); font-size: 9px; font-style: normal; text-align: right; }
  .personal-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .personal-head span { color: var(--green); font-size: 9px; letter-spacing: 1px; }
  .personal-head em { color: var(--gold); font-size: 9px; font-style: normal; }
  .personal-main { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .personal-points small { display: block; color: #b5d2cf; font-size: 9px; }
  .personal-points strong { color: var(--gold); font-size: 23px; line-height: 1; font-variant-numeric: tabular-nums; }
  .personal-points label { margin-left: 3px; color: var(--green); font-size: 9px; }
  .checkin-button { min-height: 28px; padding: 5px 8px; color: #071416; background: var(--pink); border: 2px solid #ffdbe3; border-radius: 0; box-shadow: 3px 3px 0 #080617; font: 900 10px var(--ui-font); cursor: pointer; }
  .checkin-button:hover { background: var(--gold); transform: translate(-1px, -1px); }
  .checkin-button:disabled { color: #c3d8d4; background: #235a5a; border-color: var(--line); cursor: default; transform: none; }

  /* 悬停提示 */
  #tip {
    position: absolute; z-index: 30; pointer-events: none; display: none;
    background: #0e2528; border: 2px solid var(--cyan);
    border-radius: 0; padding: 10px 12px; font-size: 13px; min-width: 176px;
    box-shadow: 4px 4px 0 #080617;
  }
  #tip .t { color: var(--gold); font-weight: 700; font-size: 14px; margin-bottom: 7px; }
  #tip .l { display: flex; justify-content: space-between; gap: 16px; color: #c4ded9; line-height: 1.8; }
  #tip .l b { color: var(--cyan); font-variant-numeric: tabular-nums; font-weight: 700; }

  /* 单人明细弹窗 */
  #modal {
    position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
  }
  #modal.show { display: flex; }
  .card {
    width: 66%; max-width: 540px;
    background: var(--panel-raised);
    border: 3px solid var(--cyan); border-radius: 0; padding: 22px 24px;
    box-shadow: 8px 8px 0 #080617;
  }
  .card .hd { display: flex; align-items: center; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 12px; margin-bottom: 14px; }
  .card .hd .sw { width: 40px; height: 40px; border-radius: 0; flex: none; box-shadow: 3px 3px 0 #080617; }
  .card .hd .nm { font-size: 18px; font-weight: 800; color: var(--gold); }
  .card .hd .sub { font-size: 11px; color: #8fa6c4; margin-top: 3px; }
  .card .hd .rkbig { margin-left: auto; font-size: 30px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .kv { background: #19464a; border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; }
  .kv .k { font-size: 10px; color: #8fa6c4; letter-spacing: 1px; }
  .kv .v { font-size: 16px; font-weight: 700; color: var(--cyan); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .spark { margin-top: 14px; }
  .spark .lab { font-size: 10px; color: #8fa6c4; letter-spacing: 1px; margin-bottom: 6px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 58px; }
  .bars .b { flex: 1; background: linear-gradient(var(--cyan), #2d6d8a); border-radius: 3px 3px 0 0; min-height: 4px; }
  .bars .b.last { background: linear-gradient(var(--gold), #b8862e); }
  .close { margin-top: 16px; width: 100%; background: var(--green); color: #071416; border: 2px solid #d8fff3; border-radius: 0; padding: 11px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0 #080617; }
  .close:hover { filter: brightness(1.08); }

  /* 加载 */
  #loading {
    position: absolute; inset: 0; z-index: 60; background: #071416;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: var(--gold);
  }
  #loading .lg { font-size: 26px; font-weight: 800; letter-spacing: 3px; }
  #loading .bar { width: 220px; height: 10px; background: #0e2528; border: 2px solid var(--line); border-radius: 0; overflow: hidden; box-shadow: 3px 3px 0 #080617; }
  #loading .fill { height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
  #loading .tip2 { font-size: 12px; color: #8fa6c4; }

  @media (max-width: 900px) {
    #shell {
      height: auto; min-height: 0; grid-template-columns: 1fr; grid-template-rows: auto 270px;
      align-content: center; gap: 8px;
    }
    #frame {
      width: min(100%, calc((100vh - 248px) * 4 / 3));
      max-height: calc(100vh - 248px); grid-column: 1; grid-row: 1; justify-self: center;
    }
    #sidePanel {
      width: 100%; height: 270px; display: grid;
      grid-column: 1; grid-row: 2;
      grid-template-columns: minmax(150px, .75fr) minmax(0, 1.25fr);
      grid-template-rows: auto 1fr; gap: 6px; padding: 6px;
    }
    #topbar { grid-column: 1; grid-row: 1; grid-template-columns: 1fr; gap: 4px; }
    .stat { padding: 4px 3px; }
    .stat .k { font-size: 8px; }
    .stat .v, .stat .v.small { font-size: 12px; }
    #rankPanel { grid-column: 2; grid-row: 1 / span 2; height: 100%; padding: 6px; }
    #rankPanel h3 { margin-bottom: 4px; padding-bottom: 4px; font-size: 11px; }
    .rrow { gap: 5px; padding: 4px; margin-bottom: 2px; font-size: 10px; }
    .rrow .av { width: 14px; height: 14px; }
    .rrow .rk { width: 20px; }
    .personal-card { margin-top: 5px; padding: 5px; }
    .personal-rank-line { padding-bottom: 4px; margin-bottom: 4px; }
    .personal-rank-line small, .personal-rank-line em { font-size: 8px; }
    .personal-rank-line strong { font-size: 13px; }
    .personal-main { gap: 4px; margin-top: 3px; }
    .personal-points strong { font-size: 16px; }
    .checkin-button { min-height: 24px; padding: 3px 5px; font-size: 8px; }
  }

  /* 活动中心入口：与榜单共用像素边框，入口固定在左侧榜单顶部 */
  .activity-entry {
    position: relative; flex: none; min-width: 0; padding: 9px 9px 10px;
    background: #19464a; border: 3px solid var(--line); box-shadow: 4px 4px 0 #080617;
    overflow: hidden;
  }
  .activity-entry::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--pink); }
  .activity-entry-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-top: 2px; }
  .activity-entry-kicker { display: block; color: var(--green); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
  .activity-entry-head strong { display: block; margin-top: 2px; color: var(--gold); font-size: 15px; letter-spacing: 1px; }
  .activity-entry-head em { padding: 3px 5px; color: #071416; background: var(--green); border: 1px solid #d8fff3; font-size: 9px; font-style: normal; font-weight: 900; letter-spacing: 1px; }
  .activity-entry p { margin-top: 5px; color: #c4ded9; font-size: 10px; line-height: 1.45; }
  .activity-entry-bottom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; align-items: end; margin-top: 8px; }
  .activity-entry-progress { min-width: 0; }
  .activity-entry-progress strong { display: block; color: var(--ink); font-size: 10px; font-variant-numeric: tabular-nums; }
  .activity-entry-progress span { display: block; height: 7px; margin-top: 4px; background: #0e2528; border: 1px solid var(--line); }
  .activity-entry-progress i { display: block; height: 100%; background: var(--gold); }
  .activity-entry-count { color: var(--gold); font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums; }
  .activity-entry-count small { margin-left: 2px; color: var(--ink); font-size: 9px; }
  .lottery-open-button { grid-column: 1 / -1; min-height: 32px; padding: 6px 8px; color: #071416; background: var(--green); border: 2px solid #d8fff3; border-radius: 0; box-shadow: 3px 3px 0 #080617; font: 900 12px var(--ui-font); cursor: pointer; }
  .lottery-open-button:hover { background: var(--gold); transform: translate(-1px, -1px); }
  .lottery-open-button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  @media (max-width: 900px) {
    .activity-entry { grid-column: 1; grid-row: 2; min-height: 0; padding: 6px; }
    .activity-entry-head strong { font-size: 12px; }
    .activity-entry p { font-size: 8px; }
    .activity-entry-bottom { gap: 4px; margin-top: 4px; }
    .activity-entry-count { font-size: 17px; }
    .lottery-open-button { min-height: 26px; padding: 4px; font-size: 9px; }
  }
  @media (max-width: 760px) {
    #shell { width: 100%; height: auto; grid-template-rows: auto 360px; }
    #sidePanel { height: 360px; grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
    #topbar { grid-column: 1; grid-row: 1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .activity-entry { grid-column: 1; grid-row: 2; }
    #rankPanel { grid-column: 1; grid-row: 3; }
    .personal-head span, .personal-head em, .personal-points small { font-size: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #frame::before, #sidePanel::before { animation: none; opacity: .55; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="shell">
    <div id="frame">
      <canvas id="scene" width="1536" height="1152"></canvas>

      <div id="tip" class="hud"></div>

      <div id="modal" class="hud"><div class="card" id="card"></div></div>

      <div id="loading">
        <div class="lg">OH!薅乐马</div>
        <div class="bar"><div class="fill" id="loadFill"></div></div>
        <div class="tip2">正在开机… 网吧马儿就位中</div>
      </div>
    </div>

    <aside id="sidePanel">
      <div id="topbar">
      <div class="stat"><div class="k">近 7 日总消耗</div><div class="v" id="stTotal">0</div></div>
      <div class="stat"><div class="k">在刷机器</div><div class="v small" id="stActive">0 / 10</div></div>
      <div class="stat"><div class="k">刷新时间</div><div class="v small" id="stClock">--:--:--</div></div>
      </div>

      <section class="activity-entry" aria-labelledby="activityEntryTitle">
        <div class="activity-entry-head">
          <div>
            <span class="activity-entry-kicker">活动中心 / 01</span>
            <strong id="activityEntryTitle">幸运扭蛋机</strong>
          </div>
          <em>READY</em>
        </div>
        <p>消费每满 ¥50，解锁 1 次扭蛋</p>
        <div class="activity-entry-bottom">
          <div class="activity-entry-progress">
            <strong>¥36.40 / ¥50.00</strong>
            <span><i style="width:72.8%"></i></span>
          </div>
          <strong class="activity-entry-count">2<small>次</small></strong>
          <button id="lotteryOpenButton" class="lottery-open-button" type="button">进入扭蛋机</button>
        </div>
      </section>

      <div id="rankPanel">
        <h3><span>近 7 日 Token 消耗榜</span><span class="live"><span class="dot"></span><span id="liveLabel">LIVE</span></span></h3>
        <div id="rankList"></div>
        <section class="personal-card" aria-label="个人活动">
          <div class="personal-rank-line">
            <div><small>近 7 日个人排名</small><strong id="personalRankValue">未上榜</strong></div>
            <em id="personalRankGap">距 TOP10 --</em>
          </div>
          <div class="personal-head"><span>个人活动</span><em id="checkinStatus">今日未签到</em></div>
          <div class="personal-main">
            <div class="personal-points"><small>我的积分</small><strong id="personalPoints">1280</strong><label>PTS</label></div>
            <button id="checkinButton" class="checkin-button" type="button">每日签到 +10</button>
          </div>
        </section>
      </div>
    </aside>
  </div>
</div>

<script src="runtime-config.js"></script>
<script>
"use strict";

// ---------------------------------------------------------------------------
// OH!薅乐马 — sub2api「用户 Token 消耗排行榜」网吧看板
// 一间网吧，10 台机器 = Token 消耗榜前 10 的用户，各自的马在刷 token，
// 屏幕实时跑不同任务动画。右侧榜单实时换位；悬停看摘要、点击看单人明细。
// 数据当前为占位假数据（live 模拟），接真实接口时替换 USERS / 更新逻辑即可。
// ---------------------------------------------------------------------------

const ASSET_BASE = "assets/station-master-v3/";
const SCREEN_ASSET_BASE = "assets/screen-real-v4/";
const SCREEN_ASSET_VERSION = "?v=real-v4-20260715d";
const RUNTIME_CONFIG = window.OH_HAOLEMA_RUNTIME || {};
const QUERY_API_BASE = new URLSearchParams(window.location.search).get("api");
const GAME_API_BASE = String(QUERY_API_BASE || RUNTIME_CONFIG.apiBase || "").replace(/\/$/, "");
const GAME_API_POLL_MS = Math.max(10000, Number(RUNTIME_CONFIG.pollMs) || 30000);
const CANVAS_W = 1536, CANVAS_H = 1152;

const lotteryOpenButton = document.getElementById("lotteryOpenButton");
if (lotteryOpenButton) {
  lotteryOpenButton.addEventListener("click", () => {
    const target = new URL("lottery.html", window.location.href);
    if (new URLSearchParams(window.location.search).get("lotteryPreview") === "1") {
      target.searchParams.set("lotteryPreview", "1");
    }
    window.location.assign(target.toString());
  });
}

const PERSONAL_ACTIVITY_KEY = "oh-haolema:personal-activity";
const personalActivity = (() => {
  try {
    const saved = JSON.parse(window.localStorage.getItem(PERSONAL_ACTIVITY_KEY) || "{}");
    return {
      points: Number.isFinite(Number(saved.points)) ? Math.max(0, Number(saved.points)) : 1280,
      checkedDate: typeof saved.checkedDate === "string" ? saved.checkedDate : "",
    };
  } catch {
    return { points: 1280, checkedDate: "" };
  }
})();
function localDayStamp() {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
}
function savePersonalActivity() {
  try { window.localStorage.setItem(PERSONAL_ACTIVITY_KEY, JSON.stringify(personalActivity)); } catch { /* 浏览器禁用存储时仍保留本次状态 */ }
}
function renderPersonalActivity() {
  const checked = personalActivity.checkedDate === localDayStamp();
  const points = document.getElementById("personalPoints");
  const status = document.getElementById("checkinStatus");
  const button = document.getElementById("checkinButton");
  if (points) points.textContent = String(personalActivity.points);
  if (status) status.textContent = checked ? "今日已签到" : "今日未签到";
  if (button) {
    button.disabled = checked;
    button.textContent = checked ? "已签到 +10" : "每日签到 +10";
  }
}
document.getElementById("checkinButton")?.addEventListener("click", () => {
  if (personalActivity.checkedDate === localDayStamp()) return;
  personalActivity.points += 10;
  personalActivity.checkedDate = localDayStamp();
  savePersonalActivity();
  renderPersonalActivity();
  chime();
});

function makeWeek(seed) {
  const a = []; let s = seed * 97 + 13;
  for (let i = 0; i < 7; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; a.push(0.35 + (s % 1000) / 1000 * 0.65); }
  return a;
}

function safeNumber(value, fallback) {
  const number = Number(value);
  const fallbackNumber = Number(fallback);
  return Number.isFinite(number) ? number : (Number.isFinite(fallbackNumber) ? fallbackNumber : 0);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function maskDisplayName(value) {
  const name = String(value ?? "").trim().slice(0, 80);
  if (!name) return "匿名用户";
  if (name.includes("***")) return name;
  const at = name.indexOf("@");
  if (at > 0) return name.slice(0, Math.min(3, at)) + "***" + name.slice(at);
  return name.slice(0, 3) + "***";
}

function normalizeMode(value) {
  return value === "work" || value === "game" || value === "sleep" ? value : "work";
}

function setSourceStatus(status, detail) {
  const label = document.getElementById("liveLabel");
  if (!label) return;
  const holder = label.parentElement;
  holder.classList.toggle("demo", status === "demo");
  holder.classList.toggle("stale", status === "stale");
  label.textContent = status === "live" ? "LIVE" : status === "stale" ? "STALE" : "DEMO";
  holder.title = detail || (status === "live" ? "NewAPI 实时数据" : "本地演示数据");
}

function applyLiveRanking(data) {
  if (!data || !Array.isArray(data.users) || data.users.length === 0) {
    throw new Error("排行榜数据为空");
  }

  const liveUsers = data.users.slice(0, 10).map((row, index) => {
    const history = Array.isArray(row.history_tokens)
      ? row.history_tokens.slice(-7).map((value) => Math.max(0, safeNumber(value)) / 10000)
      : [];
    while (history.length < 7) history.unshift(0);
    return {
      id: index,
      sourceId: safeNumber(row.user_id, index),
      name: maskDisplayName(row.name),
      reqs: Math.max(0, Math.round(safeNumber(row.requests))),
      days: Math.max(1, Math.round(safeNumber(row.days, 1))),
      tokens: Math.max(0, safeNumber(row.tokens)) / 10000,
      today: Math.max(0, safeNumber(row.today_tokens, row.tokens)) / 10000,
      rate: Math.max(0, safeNumber(row.rate_tokens_per_second)) / 10000,
      mode: normalizeMode(row.mode),
      color: LIVE_COLORS[index % LIVE_COLORS.length],
      burstUntil: 0,
      week: history.some((value) => value > 0) ? history : makeWeek(index),
    };
  });

  while (liveUsers.length < 10) {
    const index = liveUsers.length;
    liveUsers.push({
      id: index,
      sourceId: 0,
      name: "空机位 " + (index + 1),
      reqs: 0,
      days: 1,
      tokens: 0,
      today: 0,
      rate: 0,
      mode: "sleep",
      color: LIVE_COLORS[index % LIVE_COLORS.length],
      burstUntil: 0,
      week: [0, 0, 0, 0, 0, 0, 0],
    });
  }

  state.users = liveUsers;
  state.dataSource = "live";
  state.summaryTotal = Math.max(0, safeNumber(data.total_tokens)) / 10000;
  state.summaryActive = Math.max(0, Math.min(10, Math.round(safeNumber(data.active_top_users))));
  const current = data.current_user || data.currentUser;
  if (current && typeof current === "object") {
    const rank = Number(current.rank);
    state.personal = {
      rank: Number.isFinite(rank) && rank > 0 ? Math.trunc(rank) : null,
      tokens: Math.max(0, safeNumber(current.tokens)) / 10000,
    };
  }
  state.lastSync = data.generated_at || new Date().toISOString();
  state.hover = -1;
  state.selected = -1;
  setSourceStatus("live", "NewAPI 同步于 " + new Date(state.lastSync).toLocaleTimeString("zh-CN"));
}

function rankingEndpoint() {
  if (!GAME_API_BASE && window.location.protocol === "file:") return "";
  const base = GAME_API_BASE || window.location.origin;
  const url = new URL("/api/ranking", base);
  url.searchParams.set("period", "week");
  url.searchParams.set("limit", "10");
  return url.toString();
}

async function refreshLiveRanking(rebuild) {
  const endpoint = rankingEndpoint();
  if (!endpoint) {
    setSourceStatus("demo");
    return false;
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch(endpoint, {
      headers: { Accept: "application/json" },
      cache: "no-store",
      signal: controller.signal,
    });
    const payload = await response.json();
    if (!response.ok || payload.success !== true) {
      throw new Error(payload.message || "排行榜接口不可用");
    }
    const current = payload.data?.current_user || payload.data?.currentUser;
    const practiceIdentity = current && typeof current === "object"
      ? { name: current.name, rank: current.rank } : null;
    document.getElementById("frame").dataset.practiceIdentity = JSON.stringify(practiceIdentity);
    window.dispatchEvent(new CustomEvent("haolema:ranking-current-user", { detail: practiceIdentity }));
    applyLiveRanking(payload.data);
    if (rebuild) {
      closeDetail();
      buildLayout();
      buildRankRows();
      renderTopbar();
    }
    return true;
  } catch (error) {
    const stale = state.dataSource === "live";
    setSourceStatus(stale ? "stale" : "demo", stale ? "NewAPI 暂时不可用，保留最近数据" : "接口未连接，使用演示数据");
    return false;
  } finally {
    clearTimeout(timeout);
  }
}

function bursting(u) { return performance.now() < u.burstUntil; }
function effRate(u) { return u.rate * (bursting(u) ? 3.2 : 1); }
function sortedUsers() { return [...state.users].sort((a, b) => b.tokens - a.tokens); }
function rankOf(id) { return sortedUsers().findIndex((u) => u.id === id) + 1; }
function renderPersonalRank() {
  const rankValue = document.getElementById("personalRankValue");
  const rankGap = document.getElementById("personalRankGap");
  if (!rankValue || !rankGap) return;
  const topUsers = sortedUsers().filter((user) => user.sourceId !== 0 || state.dataSource === "demo");
  const threshold = topUsers.length >= 10 ? topUsers[9].tokens : topUsers[topUsers.length - 1]?.tokens;
  const rank = state.personal.rank;
  if (Number.isFinite(rank) && rank > 0 && rank <= 10) {
    rankValue.textContent = "第 " + rank + " 名";
    rankGap.textContent = "已进入 TOP10";
    return;
  }
  rankValue.textContent = "未上榜";
  if (threshold === undefined) {
    rankGap.textContent = "距 TOP10 --";
    return;
  }
  const gap = Math.max(0, threshold - state.personal.tokens);
  rankGap.textContent = gap > 0 ? "距 TOP10 " + fmt(gap) + " Token" : "距 TOP10 0 Token";
}

const stations = [];
function buildLayout() {
  stations.length = 0;
  const WS = assets.ws.width;   // 1254
  SLOTS.forEach((slot, pi) => {
    const [sx, sy, S] = slot;
    const x  = sx * K, y = sy * K;
    const dw = WS * S * K, dh = WS * S * K;
    const fw = FRAME_W[state.users[pi].mode], fh = FRAME_H[state.users[pi].mode];
    const hw = fw * HORSE_SCALE * S * K, hh = fh * HORSE_SCALE * S * K;
    const hx = (sx + HORSE_LX * S) * K, hy = (sy + HORSE_LY * S) * K;
    const quad = SCREEN_QUAD.map(([qx, qy]) => [(sx + qx * S) * K, (sy + qy * S) * K]);
    stations.push({ x, y, dw, dh, playerIndex: pi, hx, hy, hw, hh, quad, screen: SCREENS[pi] });
  });
}

function buildBoss() {
  bossBox.w = (assets.boss.width / FRAMES.boss) * BOSS_SCALE * K;

}

function drawNeon() {
  const anyBurst = state.users.some(bursting);
  const target = anyBurst ? 1 : 0;
  drawNeon.k += (target - drawNeon.k) * 0.06;
  if (drawNeon.k < 0.01) return;
  const pulse = 0.5 + 0.5 * Math.sin(state.time / 260);
  const g = ctx.createRadialGradient(
    CANVAS_W / 2, CANVAS_H * 0.62, CANVAS_H * 0.2,

let actx = null;

  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();

}

  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (dur || 0.12));
  o.connect(g); g.connect(a.destination);

}

  if (tokens >= 1e6) return (tokens / 1e6).toFixed(tokens >= 1e8 ? 1 : 2) + "M";
  if (tokens >= 1e3) return (tokens / 1e3).toFixed(tokens >= 1e5 ? 1 : 2) + "K";

}

      '<span class="nm"></span>' +
      '<span class="fire">🔥</span>' +
      '<span class="tk"></span>';
    row.addEventListener("mouseenter", () => { state.hover = u.id; positionTip(u.id); });
    row.addEventListener("mousemove", () => positionTip(u.id));
    row.addEventListener("mouseleave", () => { state.hover = -1; hideTip(); });
    row.addEventListener("click", () => openDetail(u.id));
    box.appendChild(row);
    rowEls.set(u.id, row);
  });
}
const ROW_H = 40; // 行高 + 间距（px，近似，用于换位位移）
function renderRank() {
  const order = sortedUsers();
  const medals = ["🥇", "🥈", "🥉"];
  order.forEach((u, idx) => {
    const row = rowEls.get(u.id);
    if (!row) return;
    // 用 order 里的目标位置减去 DOM 里的原始位置，做 translateY 平滑滑动
    const domIdx = Number(row.style.order || u.id);
    row.style.order = idx;
    row.querySelector(".rk").textContent = idx < 3 ? medals[idx] : (idx + 1);
    row.querySelector(".nm").textContent = u.name;
    row.querySelector(".tk").textContent = fmt(u.tokens);
    row.classList.toggle("top", idx < 3);
    row.classList.toggle("hot", state.hover === u.id || state.selected === u.id);
    row.classList.toggle("burst", bursting(u));
  });
  // 用 flex order 实现换位（需要容器 flex-direction:column）
  const box = document.getElementById("rankList");
  box.style.display = "flex";
  box.style.flexDirection = "column";
}

// ---------------------------------------------------------------------------
// 互动 1：悬停看详情（画布悬停高亮 + 跟随提示框；榜单行悬停同样触发）
// ---------------------------------------------------------------------------
const tip = document.getElementById("tip");
function showTipFor(id, clientX, clientY) {
  const u = state.users.find((x) => x.id === id);
  if (!u) return;
  const rk = rankOf(id);
  const displayName = escapeHtml(u.name);
  tip.innerHTML =
    '<div class="t">' + displayName + '</div>' +
    '<div class="l"><span>排名</span><b>#' + rk + '</b></div>' +
    '<div class="l"><span>累计 Token</span><b>' + fmt(u.tokens) + '</b></div>' +
    '<div class="l"><span>当前速率</span><b>' + fmt(effRate(u)) + ' Token/s</b></div>' +
    (bursting(u) ? '<div class="l"><span>状态</span><b style="color:#ff9e6d">🔥 爆刷中</b></div>' : '');
  tip.style.display = "block";
  const frame = document.getElementById("frame").getBoundingClientRect();
  let x = clientX - frame.left + 14, y = clientY - frame.top + 14;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > frame.width) x = clientX - frame.left - tw - 14;
  if (y + th > frame.height) y = frame.height - th - 8;
  x = Math.max(8, Math.min(x, frame.width - tw - 8));
  y = Math.max(8, Math.min(y, frame.height - th - 8));
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function positionTip(id) {
  const e = window.event;
  showTipFor(id, e ? e.clientX : 0, e ? e.clientY : 0);
}
function hideTip() { tip.style.display = "none"; }

// ---------------------------------------------------------------------------
// 互动 2：点击查看单人明细
// ---------------------------------------------------------------------------
function openDetail(id) {
  const u = state.users.find((x) => x.id === id);
  if (!u) return;
  state.selected = id;
  const rk = rankOf(id);
  const medal = rk === 1 ? "🥇" : rk === 2 ? "🥈" : rk === 3 ? "🥉" : "#" + rk;
  const maxW = Math.max(0.0001, ...u.week);
  const bars = u.week.map((w, i) =>
    '<div class="b' + (i === 6 ? " last" : "") + '" style="height:' + Math.round(w / maxW * 100) + '%"></div>'
  ).join("");
  const dayLabel = state.dataSource === "live" ? "近 7 日活跃 " : "注册 ";
  const displayName = escapeHtml(u.name);
  const card = document.getElementById("card");
  card.innerHTML =
    '<div class="hd">' +
      '<span class="sw" style="background:' + u.color + '"></span>' +
      '<div><div class="nm">' + displayName + '</div>' +
      '<div class="sub">' + dayLabel + u.days + ' 天</div></div>' +
      '<span class="rkbig">' + medal + '</span>' +
    '</div>' +
    '<div class="grid">' +
      '<div class="kv"><div class="k">累计 TOKEN</div><div class="v">' + fmt(u.tokens) + '</div></div>' +
      '<div class="kv"><div class="k">今日消耗</div><div class="v">' + fmt(u.today) + '</div></div>' +
      '<div class="kv"><div class="k">总请求数</div><div class="v">' + fmtInt(u.reqs) + '</div></div>' +
      '<div class="kv"><div class="k">当前速率</div><div class="v">' + fmt(effRate(u)) + '<span style="font-size:11px"> Token/s</span></div></div>' +
      '<div class="kv"><div class="k">日均消耗</div><div class="v">' + fmt(u.tokens / u.days) + '</div></div>' +
      '<div class="kv"><div class="k">状态</div><div class="v" style="color:' + (bursting(u) ? "#ff9e6d" : "#63e990") + '">' + (bursting(u) ? "🔥 爆刷" : u.mode === "sleep" ? "💤 挂机" : "⌨️ 在刷") + '</div></div>' +
    '</div>' +
    '<div class="spark"><div class="lab">近 7 日消耗趋势</div><div class="bars">' + bars + '</div></div>' +
    '<button class="close" id="closeBtn">关闭</button>';
  document.getElementById("closeBtn").addEventListener("click", closeDetail);
  document.getElementById("modal").classList.add("show");
}
function closeDetail() {
  state.selected = -1;
  document.getElementById("modal").classList.remove("show");
}
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeDetail();
});

// ---------------------------------------------------------------------------
// 画布命中测试：悬停 / 点击工位
// ---------------------------------------------------------------------------
function stationAt(x, y) {
  // 从前排（后画、在上层）往后排找，命中框用工位框范围
  for (let i = stations.length - 1; i >= 0; i--) {
    const s = stations[i];
    if (x >= s.x && x <= s.x + s.dw && y >= s.y + s.dh * 0.15 && y <= s.y + s.dh) return i;
  }
  return -1;
}
function canvasXY(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * (CANVAS_W / r.width), (e.clientY - r.top) * (CANVAS_H / r.height)];
}
canvas.addEventListener("mousemove", (e) => {
  const [x, y] = canvasXY(e);
  const i = stationAt(x, y);
  state.hover = i;
  if (i >= 0) { canvas.style.cursor = "pointer"; showTipFor(state.users[i].id, e.clientX, e.clientY); }
  else { canvas.style.cursor = bossHitTest(x, y) ? "pointer" : "default"; hideTip(); }
});
canvas.addEventListener("mouseleave", () => { state.hover = -1; hideTip(); });
canvas.addEventListener("click", (e) => {
  const [x, y] = canvasXY(e);
  const i = stationAt(x, y);
  if (i >= 0) { openDetail(state.users[i].id); blip(660, 0.09, "square", 0.1); return; }
  if (bossHitTest(x, y)) spurAll();
});

// ---------------------------------------------------------------------------
// 互动 4：点老板「全场催活」——所有用户同时爆刷，老板抖一下 + 口号飘字
// ---------------------------------------------------------------------------
const SPUR_PHRASES = ["都给我刷起来！", "催活啦！", "别摸鱼！", "把 Token 拉满！", "老板发威！"];
let spurCount = 0;
function spurAll() {
  const now = performance.now();
  bossShakeUntil = now + 260;
  for (const u of state.users) u.burstUntil = now + 3200 + Math.random() * 2600;
  const cx = bossBox.x + bossBox.w / 2, cy = bossBox.y + bossBox.h * 0.2;
  floatText(SPUR_PHRASES[spurCount % SPUR_PHRASES.length], cx, cy, "#ff8a4d", 34);
  spurCount++;
  chime();
}

// ---------------------------------------------------------------------------
// 互动 3：榜单实时滚动/换位（live 模拟数据流）
// ---------------------------------------------------------------------------
function tickData(dt) {
  if (state.dataSource !== "live") {
    for (const u of state.users) {
      const gain = effRate(u) * dt;
      u.tokens += gain;
      u.today += gain;
    }
    // 演示模式下制造换位；真实模式只在轮询时更新数值。
    if (Math.random() < dt * 0.55) {
      const u = state.users[Math.floor(Math.random() * state.users.length)];
      u.burstUntil = performance.now() + 2600 + Math.random() * 2600;
    }
  }
}

// ===========================================================================
// 主循环
// ===========================================================================
let last = performance.now();
let clockTick = -1;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  state.time = now;
  tickData(dt);
  if (document.getElementById("frame").dataset.practiceVisible === "true") {
    requestAnimationFrame(loop);
    return;
  }
  render(dt);
  renderRank();
  if (Math.floor(now / 250) !== clockTick) {
    clockTick = Math.floor(now / 250);
    renderTopbar();
    // 明细弹窗打开时，实时刷新其中的数字
    if (state.selected >= 0 && document.getElementById("modal").classList.contains("show")) {
      openDetail(state.selected);
    }
  }
  requestAnimationFrame(loop);
}

// ===========================================================================
// 启动
// ===========================================================================
async function start() {
  try {
    await loadAll();
  } catch (err) {
    document.querySelector("#loading .tip2").textContent = "素材加载失败：" + err.message;
    return;
  }
  buildLayout();
  buildBoss();
  buildRankRows();
  renderTopbar();
  setSourceStatus("demo");
  document.getElementById("loading").style.display = "none";
  requestAnimationFrame(loop);
  refreshLiveRanking(true);
  rankingPollTimer = window.setInterval(() => refreshLiveRanking(true), GAME_API_POLL_MS);
}
start();
</script>
