services:
  oh-haolema-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - ./game-api.env
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
