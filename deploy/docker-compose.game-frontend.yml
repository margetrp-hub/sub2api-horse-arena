services:
  oh-haolema-web:
    build:
      context: ..
      dockerfile: deploy/game-frontend.Dockerfile
      args:
        GAME_BASE_PATH: /game/
    ports:
      - "127.0.0.1:8098:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
