# Include only in the Sub2API virtual host which serves /game/.
# Preserve the host login, registration and provider callback implementation.
location ~ ^/(?:login|register|auth|oauth|dashboard|admin/dashboard)(?:/|$) {
    proxy_pass http://sub2api_app;
    proxy_http_version 1.1;
    proxy_set_header Host $sub2api_upstream_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    sub_filter_once on;
    sub_filter '</head>' '<script defer src="/game/auth-return.js?v=20260909a" data-source="sub2api"></script></head>';
    add_header Cache-Control "no-store" always;
}
